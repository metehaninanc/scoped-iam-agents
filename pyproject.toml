[project]
name = "iamagents"
version = "0.1.0"
description = "Scoped IAM agents: a multi-agent IAM helpdesk on Microsoft Entra with an enforced permission boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp",
    "msgraph-sdk",
    "azure-identity",
    "pydantic>=2",
    "pyyaml",
    "starlette",
    "httpx",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iamagents"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
markers = [
    "live: touches the real tenant; run only with -m live and after asking",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/live/*" = ["E501"]
"eval/*" = ["E501"]  # report tables and help strings
"tests/unit/test_eval_*.py" = ["E501"]
"tests/unit/test_seed_config.py" = ["E501"]
"tests/unit/test_seed_engine.py" = ["E501"]
"tests/unit/test_seed_*.py" = ["E501"]
"tests/unit/fake_graph_server.py" = ["E501"]
"seed/*" = ["E501"]
"src/iamagents/seedconfig.py" = ["E501"]  # long validation messages
"tests/unit/test_tenant.py" = ["E501", "F811"]  # fixture imported from test_eval_harness
